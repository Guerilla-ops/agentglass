<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" width="1280" height="240"
 role="img" aria-label="agentglass">
<!--
  One moving part, and every ring closes.

  THE RINGS. They used to be four, at r=120, 176, 240 and 310, centred on the
  CANVAS at (640,95) rather than on the mark — so they sat behind the wordmark
  instead of around the planet, and in a canvas 190 tall the outer three could
  not close: they left through the top and bottom edges and came back, which
  reads as a circle somebody cut. A ring centred on the mark closes only if its
  radius fits the SHORTER half of the canvas, so the canvas grew to 240 and the
  three radii are 78, 92 and 106 against a half-height of 120 — 14px of margin
  at the tightest. Deleting them instead was the wrong fix twice over: it threw
  away the depth they give the mark, and the complaint was that they were cut,
  not that they were there.

  They no longer breathe. Four rings pulsing on their own clocks, plus four
  twinkling dots on four more, was nine animations for a mark whose subject is
  one satellite.

  THE BAND. A 460px gradient slid across every six seconds. It peaks at
  #c7d2fe at .14 opacity against a wordmark at #fff — not enough contrast to
  read as light passing over glass, and plenty to read as a grey rectangle with
  two hard vertical edges crossing the letters.

  THE CONTACT. It was a <g> rotated about the planet's centre, which traces a
  CIRCLE of radius 31.2 while the orbit is an ellipse with semi-axes 29 and 8.
  The two agree only at the ends of the major axis; at the minor axis the dot
  sat 23 units — 46px at this scale, a third of the mark — outside its own
  ring. animateMotion along the same arc pair the orbit is stroked from cannot
  drift, because it is the same path. Two copies, one drawn behind the planet
  and one in front, each showing for the half of the cycle it belongs to: that
  is what makes it a pass rather than a dot sliding over the glass.
-->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#090818"/><stop offset=".45" stop-color="#1b0b38"/>
<stop offset="1" stop-color="#090818"/></linearGradient>
<radialGradient id="glow" cx=".36" cy=".5" r=".75">
<stop offset="0" stop-color="#6366f1" stop-opacity=".26"/>
<stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<radialGradient id="sheen" cx=".34" cy=".28" r=".82">
<stop offset="0" stop-color="#fff" stop-opacity=".72"/>
<stop offset=".5" stop-color="#fff" stop-opacity=".15"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="240" rx="10" fill="url(#bg)"/>
<rect width="1280" height="240" rx="10" fill="url(#glow)"/>
<g fill="none" stroke="#a78bfa">
<circle cx="429" cy="120" r="78" stroke-opacity=".10"/>
<circle cx="429" cy="120" r="92" stroke-opacity=".07"/>
<circle cx="429" cy="120" r="106" stroke-opacity=".05"/></g>
<g transform="translate(369,52) scale(2.0)">
  <path d="M14.1 54.9 A29 8 -52 0 1 49.9 9.1" fill="none" stroke="#a78bfa" stroke-opacity=".4" stroke-width="3.2" stroke-linecap="round"/>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;.5" dur="16s" calcMode="discrete" repeatCount="indefinite"/>
    <animateMotion dur="16s" repeatCount="indefinite"
      path="M49.9 9.1 A29 8 -52 0 1 14.1 54.9 A29 8 -52 0 1 49.9 9.1"/>
    <circle r="6.8" fill="#34d399" fill-opacity=".18"/><circle r="3.6" fill="#34d399"/></g>
  <circle cx="30" cy="34" r="12.5" fill="#a78bfa"/>
  <circle cx="30" cy="34" r="12.5" fill="url(#sheen)"/>
  <g fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="1.1">
  <ellipse cx="30" cy="34" rx="12.5" ry="4.5"/><ellipse cx="30" cy="34" rx="6" ry="12.1"/></g>
  <path d="M30 21.5 A12.5 12.5 0 0 1 30 46.5 A17.0 17.0 0 0 0 30 21.5 Z" fill="#1b0b38" fill-opacity=".42"/>
  <path d="M49.9 9.1 A29 8 -52 0 1 14.1 54.9" fill="none" stroke="#a78bfa" stroke-width="3.2" stroke-linecap="round"/>
  <g>
    <animate attributeName="opacity" values="1;0" keyTimes="0;.5" dur="16s" calcMode="discrete" repeatCount="indefinite"/>
    <animateMotion dur="16s" repeatCount="indefinite"
      path="M49.9 9.1 A29 8 -52 0 1 14.1 54.9 A29 8 -52 0 1 49.9 9.1"/>
    <circle r="6.8" fill="#34d399" fill-opacity=".18"/><circle r="3.6" fill="#34d399"/></g></g>
<text x="565" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="66" font-weight="700"
 fill="#ffffff" letter-spacing="-1.6">agentglass</text>
</svg>
